# Bicep: what-if on validation, incremental deployment on deploy. Sets $(functionAppName) on deploy.
parameters:
  - name: mode
    type: string
    values: [whatif, deploy]
  - name: environmentName
    type: string
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: location
    type: string

steps:
  - task: AzureCLI@2
    displayName: Bicep ${{ parameters.mode }} (${{ parameters.environmentName }})
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
        az group create --name '${{ parameters.resourceGroup }}' --location '${{ parameters.location }}' --output none
        if [ '${{ parameters.mode }}' = 'whatif' ]; then
          az deployment group what-if \
            --resource-group '${{ parameters.resourceGroup }}' \
            --parameters 'infra/bicep/main.${{ parameters.environmentName }}.bicepparam'
        else
          name=$(az deployment group create \
            --resource-group '${{ parameters.resourceGroup }}' \
            --name "app-$(Build.BuildId)" \
            --parameters 'infra/bicep/main.${{ parameters.environmentName }}.bicepparam' \
            --query properties.outputs.functionAppName.value --output tsv)
          echo "##vso[task.setvariable variable=functionAppName]$name"
        fi
